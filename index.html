<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画布 · 录屏工具</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236C5CE7'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E画%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/ui/style.css" />
  <link rel="stylesheet" href="/src/ui/editor.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">画布 <span class="ver">v2-step-6a</span></h1>
      <p class="subtitle">双轨录制(屏幕 + 摄像头)</p>
    </header>

    <main class="main">
      <div id="status" class="status">初始化中…</div>

      <div class="preview-row">
        <div class="preview-card">
          <div class="preview-card-label">屏幕画面(录制时实时显示)</div>
          <div class="preview-box">
            <video id="screenPreview" class="preview-video hidden" muted></video>
            <div id="screenPlaceholder" class="preview-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
              <p>尚未开始录制</p>
            </div>
          </div>
        </div>

        <div class="preview-card">
          <div class="preview-card-label">摄像头画面(提前授权)</div>
          <div class="preview-box">
            <video id="camPreview" class="preview-video hidden" muted autoplay playsinline></video>
            <div id="camPlaceholder" class="preview-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
              <p id="camPlaceholderText">等待授权摄像头…</p>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="btnStart" class="btn btn-primary" disabled>开始录屏</button>
        <button id="btnStop" class="btn btn-danger hidden">停止录制</button>
        <span id="timer" class="timer hidden">00:00</span>
      </div>

      <div id="storageInfo" class="storage-info"></div>
    </main>

    <section class="sessions">
      <h2 class="sessions-title">最近录制 <span id="sessionsCount" class="sessions-count"></span></h2>
      <div id="sessionsList" class="sessions-list">
        <p class="sessions-empty">还没有录制任何会话。</p>
      </div>
    </section>

    <footer class="footer">
      <p>v2-step-3:双轨分离录制。屏幕与摄像头各自独立存入 IndexedDB,为后续画布合成做准备。</p>
    </footer>
  </div>

  <!-- Editor view (hidden by default) -->
  <div id="editorView" class="editor-view hidden">
    <div class="editor-topbar">
      <div class="editor-topbar-left">
        <button id="editorBack" class="editor-back">← 返回</button>
        <span class="editor-title" id="editorTitle">画布编辑器</span>
      </div>
      <div class="editor-topbar-right">
        <span id="editorSessionInfo" class="editor-title" style="color:var(--text2)"></span>
        <button class="editor-export" id="btnExport" title="合成为 mp4 并保存">导出视频</button>
      </div>
    </div>

    <aside class="editor-sidebar">
      <div class="layer-list">
        <div class="layer-list-title">图层</div>
        <div id="layerList"></div>
      </div>
    </aside>

    <main class="editor-canvas-area">
      <div class="canvas-toolbar">
        <div class="layout-dropdown">
          <button class="canvas-toolbar-btn" id="btnLayoutMenu" title="快速布局">快速布局 ▾</button>
          <div class="layout-menu hidden" id="layoutMenu"></div>
        </div>
        <div class="canvas-toolbar-sep"></div>
        <button class="canvas-toolbar-btn" id="btnFitView" title="适应窗口">适应</button>
        <button class="canvas-toolbar-btn" id="btnZoomIn" title="放大">+</button>
        <button class="canvas-toolbar-btn" id="btnZoomOut" title="缩小">−</button>
        <div class="canvas-toolbar-sep"></div>
        <button class="canvas-toolbar-btn" id="btnLayerUp" title="置上一层" disabled>上移</button>
        <button class="canvas-toolbar-btn" id="btnLayerDown" title="置下一层" disabled>下移</button>
      </div>

      <div class="canvas-stage-wrapper" id="canvasStageWrapper">
        <div class="canvas-stage" id="canvasStage"></div>
      </div>

      <div class="canvas-info" id="canvasInfo">1080 × 1920 · 100%</div>
    </main>

    <aside class="editor-panel"></aside>

    <section class="editor-timeline" id="editorTimeline"></section>
  </div>

  <!-- 全局 toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- 导出对话框 -->
  <div id="exportDialog" class="export-dialog hidden">
    <div class="export-dialog-box">
      <div class="export-dialog-title" id="exportDialogTitle">准备导出…</div>
      <div class="export-dialog-stage" id="exportDialogStage">初始化中</div>
      <div class="export-progress-wrap">
        <div class="export-progress-bar" id="exportProgressBar"></div>
      </div>
      <div class="export-dialog-hint" id="exportDialogHint"></div>
      <div class="export-dialog-actions">
        <button class="export-dialog-btn" id="exportDialogCancel">取消</button>
        <button class="export-dialog-btn primary hidden" id="exportDialogSave">保存到本地</button>
      </div>
    </div>
  </div>

  <template id="sessionCardTemplate">
    <div class="session-card">
      <div class="session-header">
        <span class="session-id"></span>
        <div class="session-meta">
          <span class="session-duration"></span>
          <span class="session-size"></span>
          <button class="session-edit btn-small">在画布里编辑</button>
          <button class="session-delete" title="删除此会话">×</button>
        </div>
      </div>
      <div class="session-videos">
        <div class="session-track">
          <div class="session-track-label">屏幕</div>
          <video class="session-video session-video-screen" controls></video>
        </div>
        <div class="session-track">
          <div class="session-track-label">摄像头</div>
          <video class="session-video session-video-cam" controls></video>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
